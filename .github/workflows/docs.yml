name: Validate and publish documentation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: docs-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check bilingual page coverage
        run: python scripts/check_translations.py

      - name: Build site and validate links
        run: mkdocs build --strict

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger website repository deployment when a token is configured
        env:
          DOCS_PUBLISH_TOKEN: ${{ secrets.DOCS_PUBLISH_TOKEN }}
        run: |
          if [ -z "$DOCS_PUBLISH_TOKEN" ]; then
            echo "DOCS_PUBLISH_TOKEN is not configured. The website repository will pick up this update on its hourly schedule."
            exit 0
          fi

          GH_TOKEN="$DOCS_PUBLISH_TOKEN" gh api repos/ZerothRobot/ZerothRobot.github.io/dispatches \
            --method POST \
            --field event_type=docs-updated \
            --field client_payload[ref]=main \
            --field client_payload[sha]="$GITHUB_SHA"
