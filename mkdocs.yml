site_name: ZerothRobot 文档中心
site_description: ZerothRobot 产品、使用与开发文档
site_url: https://zerothrobot.github.io/docs/
repo_url: https://github.com/ZerothRobot/docs
repo_name: ZerothRobot/docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.action.edit
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - 文档首页: index.md
  - 产品总览: products/index.md
  - 产品文档:
      - M1:
          - 产品概览: products/m1/index.md
      - Bridge:
          - 产品概览: products/bridge/index.md
      - Roborigo:
          - 产品概览: products/roborigo/index.md
      - Joyin Arm:
          - 产品概览: products/joyin-arm/index.md
          - 机械臂部门教程: https://joyin-dexhand.github.io/joyin_arm_tutorial/
  - 通用指南:
      - 使用前须知: guides/index.md
      - 安全与维护: guides/safety.md
  - 常见问题: faq.md
  - 参与文档维护:
      - 文档贡献指南: contributing/index.md
      - 新增产品分类: contributing/new-product.md

strict: true
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
