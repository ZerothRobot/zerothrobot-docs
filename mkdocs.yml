hooks:
  - hooks/i18n_assets.py

site_name: ZerothRobot 文档中心
site_description: ZerothRobot 产品、使用与开发文档
site_url: https://zerothrobot.github.io/docs/
repo_url: https://github.com/ZerothRobot/zerothrobot-docs
repo_name: ZerothRobot
edit_uri: edit/main/docs/

theme:
  name: material
  favicon: assets/images/zeroth-logo.png
  icon:
    repo: fontawesome/brands/github
    alternate: material/web
  language: zh
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.action.edit
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 切换到深色模式
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切换到浅色模式

plugins:
  - search:
      lang:
        - zh
        - en
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      fallback_to_default: true
      languages:
        - locale: zh
          name: 中文
          default: true
        - locale: en
          name: English
          site_name: ZerothRobot Documentation
          site_description: Product, usage, and development documentation for ZerothRobot
          theme:
            palette:
              - scheme: default
                primary: teal
                accent: teal
                toggle:
                  icon: material/weather-sunny
                  name: Switch to dark mode
              - scheme: slate
                primary: teal
                accent: teal
                toggle:
                  icon: material/weather-night
                  name: Switch to light mode
          nav_translations:
            文档首页: Home
            产品总览: Product Overview
            产品文档: Product Documentation
            产品概览: Product Overview
            机械臂教程: Robotic Arm Tutorial
            教程首页: Tutorial Home
            使用篇: Usage
            快速上手: Quick Start
            关节电机: Joint Motor
            机械臂整臂: Complete Robotic Arm
            末端执行器: End Effector
            基础篇: Basics
            第一章 机器人与机械臂初识: "Chapter 1: Introduction to Robots and Robotic Arms"
            第二章 空间位姿与位置正运动学: "Chapter 2: Spatial Poses and Forward Position Kinematics"
            第三章 位置逆运动学: "Chapter 3: Inverse Position Kinematics"
            第四章 速度运动学与静力学: "Chapter 4: Velocity Kinematics and Statics"
            第五章 轨迹生成: "Chapter 5: Trajectory Generation"
            第六章 运动控制: "Chapter 6: Motion Control"
            进阶篇: Advanced
            第七章 构型结构设计与URDF导出: "Chapter 7: Configuration Design and URDF Export"
            第八章 动力学及控制: "Chapter 8: Dynamics and Control"
            第九章 力控制: "Chapter 9: Force Control"
            第十章 ROS2: "Chapter 10: ROS 2"
            应用篇: Applications
            第十一章 状态监测与安全软防护: "Chapter 11: State Monitoring and Safety Protection"
            第十二章 示教和遥操作: "Chapter 12: Teaching and Teleoperation"
            第十三章 末端执行器: "Chapter 13: End Effectors"
            第十四章 用户接口: "Chapter 14: User Interfaces"
            第十五章 JoyArm 综合实践项目: "Chapter 15: JoyArm Integrated Project"
            常见问题: FAQ

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: false

extra_css:
  - assets/joyin-arm/tutorial/stylesheets/mermaid.css
  - assets/joyin-arm/tutorial/stylesheets/extra.css
  - assets/stylesheets/site.css

extra_javascript:
  - assets/javascripts/site.js
  - assets/joyin-arm/tutorial/javascripts/image-viewer.js
  - assets/joyin-arm/tutorial/javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - 文档首页: index.md
  - 产品文档:
      - products/index.md
      - M1:
          - products/m1/index.md
      - Bridge:
          - products/bridge/index.md
      - Roborigo:
          - products/roborigo/index.md
      - Joyin Arm:
          - products/joyin-arm/index.md
          - 机械臂教程:
              - 教程首页: products/joyin-arm/tutorial/index.md
              - 使用篇:
                  - 快速上手: products/joyin-arm/tutorial/quick_start.md
                  - 关节电机: products/joyin-arm/tutorial/motor.md
                  - 机械臂整臂: products/joyin-arm/tutorial/arm.md
                  - 末端执行器: products/joyin-arm/tutorial/end.md
              - 基础篇:
                  - 第一章 机器人与机械臂初识: products/joyin-arm/tutorial/chapt1_intro.md
                  - 第二章 空间位姿与位置正运动学: products/joyin-arm/tutorial/chapt2_fkine.md
                  - 第三章 位置逆运动学: products/joyin-arm/tutorial/chapt3_ikine.md
                  - 第四章 速度运动学与静力学: products/joyin-arm/tutorial/chapt4_jacobian.md
                  - 第五章 轨迹生成: products/joyin-arm/tutorial/chapt5_trajectory.md
                  - 第六章 运动控制: products/joyin-arm/tutorial/chapt6_control.md
              - 进阶篇:
                  - 第七章 构型结构设计与URDF导出: products/joyin-arm/tutorial/chapt7_urdf.md
                  - 第八章 动力学及控制: products/joyin-arm/tutorial/chapt8_dyn.md
                  - 第九章 力控制: products/joyin-arm/tutorial/chapt9_force.md
                  - 第十章 ROS2: products/joyin-arm/tutorial/chapt10_ros2.md
              - 应用篇:
                  - 第十一章 状态监测与安全软防护: products/joyin-arm/tutorial/chapt11_safety.md
                  - 第十二章 示教和遥操作: products/joyin-arm/tutorial/chapt12_teleop.md
                  - 第十三章 末端执行器: products/joyin-arm/tutorial/chapt13_endeffector.md
                  - 第十四章 用户接口: products/joyin-arm/tutorial/chapt14_ui.md
                  - 第十五章 JoyArm 综合实践项目: products/joyin-arm/tutorial/chapt15_project.md
  - 常见问题: faq.md

strict: true
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
